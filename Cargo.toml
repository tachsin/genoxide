[package]
name = "genoxide"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
description = "Evolutionary computation for Rust: genetic algorithms, evolution strategies, multi-objective optimization and more"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/genoxide"
readme = "README.md"
exclude = ["benchmarks/"]
keywords = ["genetic-algorithm", "evolutionary", "optimization", "metaheuristics", "nsga2"]
categories = ["algorithms", "science", "mathematics"]
# pre-alpha: remove on the first real release (no placeholder crates on crates.io)
publish = false

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
rayon = { version = "1.12", optional = true }

[features]
default = ["parallel"]
# parallel fitness evaluation with rayon
parallel = ["dep:rayon"]

[dev-dependencies]
criterion = "0.8"
gungraun = "0.19.4"
proptest = "1"

[[example]]
name = "rastrigin"
required-features = ["parallel"]

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "instructions"
harness = false
