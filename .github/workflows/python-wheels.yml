name: Python wheels

# The wheels of the Python package: abi3, one per platform, for CPython 3.10 and later. Built and
# tested on pull requests that touch the package, by hand, and by the release workflow, which
# publishes them to PyPI.
on:
  pull_request:
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.id }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { id: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { id: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { id: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false }
          # cross-compiled on Apple silicon
          - { id: macos-x86_64, runner: macos-latest, target: x86_64, test: false }
          - { id: macos-arm64, runner: macos-latest, target: aarch64, test: true }
          - { id: windows-x64, runner: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.platform.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # the Python package has genoxide's version
      - name: Version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          perl -pi -e 's/^version = "[^"]*"/version = "'"$version"'"/ if !$done && /^version/ && ($done = 1)' python/Cargo.toml
          grep -m1 '^version' python/Cargo.toml
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: python
          args: --release --out dist
      - uses: actions/setup-python@v7
        if: matrix.platform.test
        with:
          python-version: "3.10"
      # the lowest supported Python: an abi3 wheel works on every version from it
      - name: Test
        if: matrix.platform.test
        run: |
          python -m pip install pytest python/dist/*.whl
          cd python/tests && python -m pytest -q
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.platform.id }}
          path: python/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          perl -pi -e 's/^version = "[^"]*"/version = "'"$version"'"/ if !$done && /^version/ && ($done = 1)' python/Cargo.toml
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-sdist
          path: python/dist
