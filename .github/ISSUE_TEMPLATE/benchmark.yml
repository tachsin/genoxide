name: Benchmark
description: A setting that brings a library closer to a method's definition, or a mistake in the benchmarks
labels: [benchmarks]
body:
  - type: markdown
    attributes:
      value: |
        The benchmarks follow [the rules](https://github.com/tachsin/genoxide/blob/main/docs/benchmarks/rules.md): three problems, each with one method, [defined](https://github.com/tachsin/genoxide/blob/main/docs/benchmarks/rules.md#6-the-methods) the same for every library. Each library's page in [docs/benchmarks/libraries/](https://github.com/tachsin/genoxide/tree/main/docs/benchmarks/libraries) maps its configuration to the definitions and lists its differences. A correction is tested under the same rules, and the page records it.
  - type: input
    id: library
    attributes:
      label: Library
      description: e.g. pymoo, jMetal, genoxide
    validations:
      required: true
  - type: input
    id: problem
    attributes:
      label: Problem
      description: e.g. rastrigin-30-matched
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: The correction
      description: The setting or difference, and where the library documents it (a link to its docs, an example or its source).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Results you got, if any, e.g. success rate or evaluations to the target.
