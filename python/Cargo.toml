[package]
name = "genoxide-python"
# genoxide's version: the wheels take it from genoxide's Cargo.toml when they're built
version = "0.5.2"
edition = "2024"
rust-version = "1.86"
description = "Python bindings of genoxide"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/genoxide"
publish = false

[lib]
name = "_genoxide"
crate-type = ["cdylib"]

[dependencies]
genoxide = { path = "..", features = ["parallel"] }
numpy = "0.29"
# one wheel for every CPython from 3.10
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
