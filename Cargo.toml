[workspace]
# the library, the root package, and its Python package, which share the version and Cargo.lock.
# (With "." among the members, the members would include every directory, excluded ones too.)
members = ["python"]
# cargo commands at the root build the library only: maturin builds the Python package
default-members = ["."]
# crates of their own, with genoxide as a path dependency
exclude = ["benchmarks", "examples/gpu"]

[workspace.package]
# genoxide's version, which the Python package has as well: release-plz bumps it here
version = "0.11.0"

[package]
name = "genoxide"
version.workspace = true
edition = "2024"
rust-version = "1.88"
description = "Optimization for Rust: genetic algorithms, evolution strategies, differential evolution, CMA-ES, multi-objective optimization and more"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/genoxide"
readme = "README.md"
exclude = [".github/", "/assets/", "benchmarks/", "examples/gpu/", "python/", "release-plz.toml", "/site/"]
keywords = ["optimization", "genetic-algorithm", "evolutionary", "metaheuristics", "multi-objective"]
categories = ["algorithms", "science", "mathematics"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
postcard = { version = "1.1", optional = true, default-features = false, features = ["use-std"] }
rayon = { version = "1.12", optional = true }
serde = { version = "1.0.219", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
toml = { version = "0.9", optional = true, default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1.41", optional = true, default-features = false, features = ["std"] }
libm = "0.2"

[features]
default = ["parallel"]
# parallel fitness evaluation with rayon
parallel = ["dep:rayon"]
# a span per run and events per generation, with the target `genoxide`
tracing = ["dep:tracing"]
# Serialize and Deserialize for algorithms and their parts, and checkpoints to resume a run
serde = ["dep:serde", "dep:postcard", "rand_chacha/serde"]
# the `genoxide` program: runs described in TOML or JSON files, with any program as the fitness
cli = ["parallel", "serde", "dep:serde_json", "dep:toml"]

[dev-dependencies]
criterion = "0.8"
gungraun = "0.19.4"
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

# the examples are examples/<name>/main.rs, which Cargo finds; this one needs rayon
[[example]]
name = "asynchronous"
path = "examples/asynchronous/main.rs"
required-features = ["parallel"]

# parallel evaluation, for the same results sooner
[[example]]
name = "nguyen_all"
path = "examples/nguyen_all/main.rs"
required-features = ["parallel"]

[[example]]
name = "accuracy_and_size"
path = "examples/accuracy_and_size/main.rs"
required-features = ["parallel"]

[[example]]
name = "two_spirals"
path = "examples/two_spirals/main.rs"
required-features = ["parallel"]

[[bin]]
name = "genoxide"
required-features = ["cli"]

# parallel breeding and evaluation
[[bench]]
name = "hot_paths"
harness = false
required-features = ["parallel"]

[[bench]]
name = "instructions"
harness = false

# the linear algebra on one thread and on eight
[[bench]]
name = "linalg"
harness = false
required-features = ["parallel"]

# L-BFGS-B at 10³, 10⁵ and 10⁶ genes: the time of a round and the peak memory
[[bench]]
name = "lbfgsb"
harness = false

# the first-order methods' steps at up to a million genes
[[bench]]
name = "first_order"
harness = false

# the Python package's wheels: `profile` in python/pyproject.toml. Thin LTO, on every codegen unit:
# measured on 4 cores, it builds the bindings in 130 s against fat LTO's 458 s with one unit, and
# the Python examples run as fast (within 3% either way)
[profile.wheel]
inherits = "release"
lto = "thin"
