[package]
name = "genoxide"
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
description = "Evolutionary computation for Rust: genetic algorithms, evolution strategies, multi-objective optimization and more"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/genoxide"
readme = "README.md"
exclude = [".github/", "benchmarks/", "release-plz.toml"]
keywords = ["genetic-algorithm", "evolutionary", "optimization", "metaheuristics", "ga"]
categories = ["algorithms", "science", "mathematics"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
rand = "0.10"
rand_chacha = "0.10"
rayon = { version = "1.12", optional = true }
tracing = { version = "0.1.41", optional = true, default-features = false, features = ["std"] }

[features]
default = ["parallel"]
# parallel fitness evaluation with rayon
parallel = ["dep:rayon"]
# a span per run and events per generation, with the target `genoxide`
tracing = ["dep:tracing"]

[dev-dependencies]
criterion = "0.8"
gungraun = "0.19.4"
proptest = "1"

[[example]]
name = "rastrigin"
required-features = ["parallel"]

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "instructions"
harness = false
