[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "genoxide"
description = "Optimization in Rust, for Python: genetic algorithms, CMA-ES, differential evolution, NSGA-II, L-BFGS-B, Adam, MMA and more, reproducible on every platform"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["licenses/LICENSE-MIT", "licenses/LICENSE-APACHE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]
keywords = [
    "optimization",
    "genetic-algorithm",
    "evolutionary-algorithm",
    "metaheuristics",
    "cma-es",
    "differential-evolution",
    "particle-swarm-optimization",
    "multi-objective",
    "nsga2",
    "l-bfgs-b",
    "adam",
    "method-of-moving-asymptotes",
    "nelder-mead",
    "genetic-programming",
    "neuroevolution",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/tachsin/genoxide"
Documentation = "https://tachsin.github.io/genoxide/api/python/"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.maturin]
module-name = "genoxide._genoxide"
# the Cargo profile of the workspace in ../Cargo.toml, with thin LTO
profile = "wheel"

[tool.pytest.ini_options]
testpaths = ["tests"]
