name: Release

on:
  push:
    branches: [main]

jobs:
  # after a release PR is merged: tag the version and create the GitHub release
  release:
    name: Release
    if: ${{ github.repository_owner == 'tachsin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      released: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.139
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # after a release: the Python package's wheels, built and tested...
  python-wheels:
    name: Python wheels
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/python-wheels.yml

  # ...and published to PyPI, as a trusted publisher: PyPI trusts this workflow file and the
  # `pypi` environment, so no token is stored
  pypi:
    name: Publish to PyPI
    needs: python-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/genoxide/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # open or update the release PR: version bump (checked by cargo-semver-checks) and changelog
  release-pr:
    name: Release PR
    if: ${{ github.repository_owner == 'tachsin' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
