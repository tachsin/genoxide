[package]
name = "genoxide-python"
# genoxide's version, from the workspace
version.workspace = true
edition = "2024"
rust-version = "1.95"
description = "Python bindings of genoxide"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tachsin/genoxide"
publish = false

[lib]
name = "_genoxide"
crate-type = ["cdylib"]

[dependencies]
genoxide = { path = "..", features = ["parallel", "serde"] }
numpy = "0.29"
# one wheel for every CPython from 3.10
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# a parallel run's calls, while the thread that called `run` checks for Ctrl+C
rayon = "1.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
