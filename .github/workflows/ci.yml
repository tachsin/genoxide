name: CI

on:
  push:
    branches: [main]
    # code only: a change to documentation alone (markdown, the docs, the site, the benchmark
    # harness and its results, the examples' recorded runs) doesn't run the checks. The markdown
    # that is code stays in: README.md and AGENTS.md are doctests, python/README.md's blocks run
    # in the Python tests. Later patterns override earlier ones.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!site/**"
      - "!benchmarks/**"
      - "!examples/**/trace.json"
      - "!LICENSE-*"
      - "!.github/workflows/docs-site.yml"
      - "!.github/workflows/library-releases.yml"
      - "!.github/workflows/pr-title.yml"
      - "README.md"
      - "AGENTS.md"
      - "python/README.md"
  pull_request:
    # the same paths as for a push to main
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!site/**"
      - "!benchmarks/**"
      - "!examples/**/trace.json"
      - "!LICENSE-*"
      - "!.github/workflows/docs-site.yml"
      - "!.github/workflows/library-releases.yml"
      - "!.github/workflows/pr-title.yml"
      - "README.md"
      - "AGENTS.md"
      - "python/README.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets --all-features
      - run: cargo test --all-features

  features:
    name: Features and single thread
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features
      # parallel code must not rely on having more than one thread
      - run: cargo test
        env:
          RAYON_NUM_THREADS: 1

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # every examples/<name>/main.rs, which Cargo finds as the example <name>, printing what its
      # output.txt has. They are built once, then run as many at a time as the runner has cores:
      # most are single-threaded, and the ones that use rayon give the same results on any number
      # of threads. The asynchronous examples' numbers depend on the machine (its thread count and
      # how long each evaluation takes): their output is compared with every number replaced by #.
      # Every example is checked, and the step fails at the end if any differs.
      - run: cargo build --release --examples
      - run: |
          numbers() { sed -E 's/[0-9]+(\.[0-9]+)?/#/g' "$@"; }
          mkdir -p actual
          examples=$(for main in examples/*/main.rs; do basename "$(dirname "$main")"; done)
          # each example's output, errors, exit status and run time, in files of its own
          echo "$examples" | xargs -P "$(nproc)" -I{} sh -c '
            start=$(date +%s%N)
            target/release/examples/{} > actual/{}.txt 2> actual/{}.err
            echo $? > actual/{}.status
            echo $(( ($(date +%s%N) - start) / 1000000 )) > actual/{}.ms'
          failed=""
          for example in $examples; do
            echo "::group::$example ($(cat "actual/$example.ms") ms)"
            cat "actual/$example.txt" "actual/$example.err"
            echo "::endgroup::"
            if [ "$(cat "actual/$example.status")" != 0 ]; then
              echo "::error::$example exited with status $(cat "actual/$example.status")"
              failed="$failed $example"
            elif [ "$example" = asynchronous ] || [ "$example" = bo_asynchronous ]; then
              diff <(numbers "examples/$example/output.txt") <(numbers "actual/$example.txt") \
                || failed="$failed $example"
            else
              diff "examples/$example/output.txt" "actual/$example.txt" || failed="$failed $example"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::output differs from output.txt:$failed"
            exit 1
          fi
      # the GPU example needs a GPU to run: it's only compiled, and its output.txt is from a run on
      # a GPU
      - run: cargo check --manifest-path examples/gpu/Cargo.toml

  instructions:
    name: Instruction counts
    runs-on: ubuntu-latest
    env:
      # one codegen unit, for the baseline and the pull request alike: which functions are inlined
      # then depends on the code, not on how the compiler splits the crate into units, which
      # unrelated code moves (#357's new problems made the mutation benchmarks 4 to 10% slower
      # that way, without a change to their code)
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: taiki-e/install-action@v2
        with:
          # the same version as the gungraun dev-dependency
          tool: gungraun-runner@0.19.4
      # on pull requests, the counts of the base branch are the baseline: more than 5% more
      # instructions in any benchmark fails the job
      - name: Baseline
        if: github.event_name == 'pull_request'
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          if cargo bench --bench instructions -- --save-baseline=base; then
            echo "BASELINE=--baseline=base --callgrind-limits=ir=5%" >> "$GITHUB_ENV"
          else
            echo "no instruction benchmarks on the base branch"
          fi
          git checkout --quiet ${{ github.sha }}
      - name: Instruction counts
        env:
          # plain text for the job summary
          GUNGRAUN_COLOR: never
        run: |
          set -o pipefail
          cargo bench --bench instructions -- $BASELINE | tee instructions.txt
          { echo '```text'; cat instructions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # docs.rs builds the documentation with all features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # UTF-8 output on Windows too, where Python writes to a pipe in the ANSI code page: an
    # example's °, ₁ or ² would otherwise differ from its output.txt
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # the Python package is a member of the workspace: its target directory is the root's
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: python -m venv .venv
      - run: |
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          pip install maturin==1.15.0 pytest mypy==2.3.1
          maturin develop --release
          # the package's own code passes strict type checking, with numpy's types
          mypy --strict genoxide
          # the tests run the README's code blocks and the module docstring's example too
          pytest -v
          # every example in Python, examples/<name>/main.py, printing what its output.txt has, on
          # every platform: the test problems use genoxide's portable math
          for example in ../examples/*/main.py; do
            folder=$(dirname "$example")
            echo "::group::$example"
            python "$example" | tee output.actual
            echo "::endgroup::"
            diff <(tr -d '\r' < "$folder/output.txt") <(tr -d '\r' < output.actual)
          done

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features
