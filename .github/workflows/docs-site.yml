name: Docs site

# The site at https://tachsin.github.io/genoxide/: pages built with Material for MkDocs from
# docs/site/ (the examples included from examples/ and python/examples/), and the API reference of
# the Python package, built with pdoc from its docstrings (NumPy style) into api/python/. Pull
# requests that touch them build the site without deploying.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "examples/**"
      - "python/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "examples/**"
      - "python/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time, and a running one finishes
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # the Python package is a member of the workspace: its target directory is the root's
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: |
          source .venv/bin/activate
          pip install -r docs/site/requirements.txt maturin==1.15.0 pdoc==16.0.0
          # pdoc imports the package, so the extension module is built first
          (cd python && maturin develop --release)
          # from the root, which the snippets of the examples are relative to; mkdocs empties
          # site/ first, so the API reference goes in after
          mkdocs build --strict
          pdoc -d numpy -o site/api/python genoxide
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
