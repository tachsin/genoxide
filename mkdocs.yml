# The site at https://tachsin.github.io/genoxide/, built by .github/workflows/docs-site.yml. The
# Python API reference is built by pdoc into site/api/python/ after this. Build from the root of the
# repository, which snippets include the examples from: mkdocs build --strict
site_name: genoxide
site_description: Evolutionary computation for Rust and Python
site_url: https://tachsin.github.io/genoxide/
repo_url: https://github.com/tachsin/genoxide
repo_name: tachsin/genoxide
edit_uri: ""

docs_dir: docs/site
site_dir: site
exclude_docs: |
  requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # relative to the directory mkdocs runs in: the root of the repository
      base_path: ["."]
      check_paths: true

nav:
  - Home: index.md
  - Examples:
      - examples/index.md
      - OneMax: examples/one-max.md
      - Knapsack: examples/knapsack.md
      - N-Queens: examples/n-queens.md
      - Rastrigin: examples/rastrigin.md
      - ZDT1: examples/zdt1.md
      - Asynchronous evaluation: examples/asynchronous.md
      - GPU: examples/gpu.md
  - Python API: https://tachsin.github.io/genoxide/api/python/
  - Rust API: https://docs.rs/genoxide
